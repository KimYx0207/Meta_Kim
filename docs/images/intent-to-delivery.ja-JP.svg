<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1016" viewBox="0 0 760 1016" lang="ja-JP" xml:lang="ja-JP" role="img" aria-labelledby="title desc">
<title id="title">意図から成果へ</title><desc id="desc">Meta_Kim は目的を調査、判断、二段階の PRD と協調作業につなぎます。Kim Service は専門的な方法を提供します。準備のできた独立作業を並行して進め、成果を確認します。これは作業の流れを説明する図です。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#7996ba" stroke-width="1.5"/></marker><style>text{font-family:Inter,"Noto Sans CJK JP","Microsoft YaHei",Arial,sans-serif}.title{fill:#f4f7ff;font-weight:700}.body{fill:#bfcde2}.accent{fill:#8ce4d7;font-weight:700}.card{fill:#14233c;stroke:#344e70;stroke-width:1.5}.design{fill:#242140;stroke:#7d6bba;stroke-width:1.5}.methods{fill:#0f3035;stroke:#398b85;stroke-width:1.5}.result{fill:#192f4b;stroke:#5485b8;stroke-width:1.5}.line{fill:none;stroke:#7996ba;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="760" height="1016" rx="24" fill="#091426"/>
<text x="40" y="47" class="accent" font-size="18">META_KIM  /  KIM SERVICE</text>
<text x="40" y="91" class="title" font-size="30">一つのアイデアから、使える成果へ。</text>
<rect x="40" y="122" width="680" height="92" rx="18" class="card"/>
<text x="64" y="159" class="title" font-size="25">あなたの目的</text><text x="64" y="191" class="body" font-size="22">欲しい結果、条件、既存プロジェクト</text>
<path d="M380 215V240" class="line"/>
<rect x="40" y="248" width="680" height="92" rx="18" class="card"/>
<text x="64" y="285" class="title" font-size="25">調べて、選ぶ</text><text x="64" y="317" class="body" font-size="22">参考資料を探し、方式を比較して決める</text>
<path d="M380 341V366" class="line"/>
<rect x="40" y="374" width="680" height="138" rx="18" class="design"/>
<text x="64" y="412" class="title" font-size="25">一つの PRD、二つの段階</text>
<path d="M380 430V489" stroke="#6c6091"/>
<text x="64" y="450" class="title" font-size="22">1  システムと技術方針</text><text x="64" y="482" class="body" font-size="20">共有する決定事項</text>
<text x="404" y="450" class="title" font-size="22">2  モジュールと接続</text><text x="404" y="482" class="body" font-size="20">具体的な受入条件</text>
<path d="M380 513V536" class="line"/>
<rect x="40" y="544" width="680" height="86" rx="18" class="methods"/>
<text x="64" y="578" class="accent" font-size="23">KIM SERVICE · 専門的な方法</text><text x="64" y="607" class="body" font-size="22">必要な知識、ツール、完成例を組み合わせる</text>
<path d="M380 631V645H200V659" class="line"/><path d="M380 645H560V659" class="line"/>
<rect x="40" y="667" width="320" height="112" rx="18" class="card"/><rect x="400" y="667" width="320" height="112" rx="18" class="card"/>
<text x="64" y="701" class="title" font-size="25">モジュール A</text><text x="64" y="732" class="body" font-size="21">担当者と方法</text><text x="64" y="761" class="body" font-size="21">プロジェクト資料</text>
<text x="424" y="701" class="title" font-size="25">モジュール B</text><text x="424" y="732" class="body" font-size="21">担当者と方法</text><text x="424" y="761" class="body" font-size="21">プロジェクト資料</text>
<path d="M200 780V798H380V811" class="line"/><path d="M560 780V798H380" fill="none" stroke="#7996ba" stroke-width="2"/>
<rect x="40" y="819" width="680" height="92" rx="18" class="result"/>
<text x="64" y="856" class="title" font-size="25">レビュー、検証、引き渡し</text><text x="64" y="887" class="body" font-size="21">成果を確認し、決定と次の作業を残す</text>
<text x="40" y="953" class="accent" font-size="23">仕事を続け、方法を改善する</text><text x="40" y="985" class="body" font-size="20">準備できた作業は並行し、評価済みの学びを再利用。</text>
</svg>
