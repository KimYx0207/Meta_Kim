<text x="700" y="48" fill="#202b25" font-size="38" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Meta_Kim の動作全体像</tspan></text>
<text x="700" y="85" fill="#5a655e" font-size="21" font-weight="450" text-anchor="middle"><tspan x="700" dy="0">一つの管理フローで進め、依存関係に沿って実行し、根拠とともに成果を渡す</tspan></text>
<text x="256" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="256" dy="0">主な流れ</tspan></text>
<text x="526" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="526" dy="0">修正・差し戻し</tspan></text>
<text x="796" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="796" dy="0">人の判断</tspan></text>
<text x="1066" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="1066" dy="0">記録への書き込み</tspan></text>
<text x="183.0" y="193.75" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="183.0" dy="0">利用者の目的</tspan></text>
<text x="428.0" y="193.75" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="428.0" dy="0">プロジェクトと制約</tspan></text>
<text x="673.0" y="193.75" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="673.0" dy="0">追加の要求</tspan></text>
<text x="918.0" y="193.75" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="918.0" dy="0">Work の文脈</tspan></text>
<text x="74" y="276" fill="#fff" font-size="23" font-weight="700" text-anchor="start"><tspan x="74" dy="0">目的・根拠・設計</tspan></text>
<text x="220.0" y="343.0" fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><tspan x="220.0" dy="0">01 重要点の確認</tspan></text>
<text x="220.0" y="380.0" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="220.0" dy="0">目的 / 範囲 / 受入条件</tspan></text>
<text x="520.0" y="343.0" fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><tspan x="520.0" dy="0">02 調査・発見</tspan></text>
<text x="520.0" y="380.0" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="520.0" dy="0">現状の事実 / 利用能力</tspan></text>
<text x="840.0" y="343.0" fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><tspan x="840.0" dy="0">03 思考・計画</tspan></text>
<text x="840.0" y="380.0" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="840.0" dy="0">同じ PRD：全体 → モジュール</tspan></text>
<text x="74" y="490" fill="#202b25" font-size="24" font-weight="700" text-anchor="start"><tspan x="74" dy="0">04 実行と動的な編成</tspan></text>
<text x="1025" y="490" fill="#5a655e" font-size="20" font-weight="450" text-anchor="end"><tspan x="1025" dy="0">クライアントとモデルは別々に選ぶ</tspan></text>
<text x="210.0" y="550.75" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="210.0" dy="0">依存関係で調整</tspan></text>
<text x="210.0" y="585.25" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="210.0" dy="0">準備完了から実行</tspan><tspan x="210.0" dy="26.0">待機は再開点を残す</tspan></text>
<text x="515.0" y="546.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="515.0" dy="0">実行可能なタスク A</tspan></text>
<text x="515.0" y="610.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="515.0" dy="0">実行可能なタスク B</tspan></text>
<text x="860.0" y="566.125" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="860.0" dy="0">同じ段階で統合</tspan></text>
<text x="860.0" y="601.875" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="860.0" dy="0">実際の成果 + 実行記録</tspan></text>
<text x="550" y="650" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="550" dy="0">実行能力は現在のクライアントが提供：Agent · Skill · ツール / MCP · Hook</tspan></text>
<text x="74" y="714" fill="#202b25" font-size="22" font-weight="700" text-anchor="start"><tspan x="74" dy="0">品質確認 · 目的・事実・設計の問題は該当段階へ</tspan></text>
<text x="220.0" y="759.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="220.0" dy="0">05 レビュー</tspan></text>
<text x="220.0" y="793.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="220.0" dy="0">目的と成果を照合</tspan></text>
<text x="520.0" y="759.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="520.0" dy="0">06 再レビュー</tspan></text>
<text x="520.0" y="793.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="520.0" dy="0">基準と根拠を確認</tspan></text>
<text x="840.0" y="759.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="840.0" dy="0">07 実地検証</tspan></text>
<text x="840.0" y="793.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="840.0" dy="0">実行 / 操作 / 確認</tspan></text>
<text x="1008" y="714" fill="#6756b4" font-size="20" font-weight="700" text-anchor="end"><tspan x="1008" dy="0">該当タスクを修正</tspan></text>
<text x="74" y="872" fill="#202b25" font-size="22" font-weight="700" text-anchor="start"><tspan x="74" dy="0">人の判断：どの段階でも必要なら</tspan></text>
<text x="156" y="935.5" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="156" dy="0">既存の決定は</tspan><tspan x="156" dy="25.0">今も有効？</tspan></text>
<text x="405.0" y="925.375" fill="#202b25" font-size="21" font-weight="700" text-anchor="middle"><tspan x="405.0" dy="0">決定を再利用</tspan></text>
<text x="405.0" y="990.375" fill="#202b25" font-size="21" font-weight="700" text-anchor="middle"><tspan x="405.0" dy="0">判断と理由を記録</tspan></text>
<text x="265" y="909" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="265" dy="0">はい</tspan></text>
<text x="265" y="975" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="265" dy="0">いいえ</tspan></text>
<text x="290" y="824" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="290" dy="0">判断を呼んだ工程へ戻る</tspan></text>
<text x="584" y="872" fill="#202b25" font-size="24" font-weight="700" text-anchor="start"><tspan x="584" dy="0">08 経験の改善</tspan></text>
<text x="681" y="927.5" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="681" dy="0">再利用できる</tspan><tspan x="681" dy="25.0">発見あり？</tspan></text>
<text x="917.0" y="926.5" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="917.0" dy="0">審査して処理</tspan><tspan x="917.0" dy="27.5">反映 / 候補保存</tspan></text>
<text x="788" y="913" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="788" dy="0">はい</tspan></text>
<text x="795" y="994" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="795" dy="0">なし：理由を記録</tspan></text>
<text x="1215" y="179" fill="#202b25" font-size="26" font-weight="700" text-anchor="middle"><tspan x="1215" dy="0">過程と根拠</tspan></text>
<text x="1215" y="211" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1215" dy="0">同じ Work / 実行に関連</tspan></text>
<text x="1215.0" y="330" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1215.0" dy="0">計画・PRD・決定</tspan></text>
<text x="1215.0" y="357" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1215.0" dy="0">設計の基準と版</tspan></text>
