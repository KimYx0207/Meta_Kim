<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc" lang="ko-KR" xml:lang="ko-KR">
<title id="title">Meta_Kim이 돕는 부분</title><desc id="desc">익숙한 AI 클라이언트에서 작업을 정리하고 계속 이어갑니다.</desc>
<style>text{font-family:Inter, Noto Sans CJK KR, sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#23765b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1040" rx="24" fill="#f7f9f5"/>
<text x="48" y="48" font-size="19" font-weight="750" fill="#23765b" text-anchor="start"><tspan x="48" dy="0">META_KIM / 작업 구조</tspan></text>
<text x="48" y="103" font-size="38" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="48" dy="0">Meta_Kim이 돕는 부분</tspan></text>
<text x="48" y="146" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="48" dy="0">익숙한 AI 클라이언트에서 작업을 정리하고 계속 이어갑니다.</tspan></text>
<rect x="60" y="190" width="460" height="145" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M84 216v93" stroke="#23765b" stroke-width="5"/>
<text x="106" y="241" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="106" dy="0">목표 전달</tspan></text>
<text x="106" y="284" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="106" dy="0">원하는 결과를 설명하고,</tspan><tspan x="106" dy="33.35">중요한 선택을 결정.</tspan></text>
<path d="M290 340V380" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="388" width="765" height="300" rx="22" fill="white" stroke="#23765b" stroke-width="2"/>
<text x="87" y="425" font-size="20" font-weight="700" fill="#23765b" text-anchor="start"><tspan x="87" dy="0">사용 중인 AI 클라이언트</tspan></text>
<rect x="85" y="458" width="335" height="180" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M109 484v128" stroke="#23765b" stroke-width="5"/>
<text x="131" y="509" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="131" dy="0">Meta_Kim</tspan></text>
<text x="131" y="552" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="131" dy="0">계획과 작업을 정리.</tspan><tspan x="131" dy="33.35">확인하고 계속 진행.</tspan></text>
<rect x="452" y="458" width="345" height="180" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M476 484v128" stroke="#23765b" stroke-width="5"/>
<text x="498" y="509" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="498" dy="0">전문 방법과 도구</tspan></text>
<text x="498" y="552" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="498" dy="0">Kim Service 패키지와</tspan><tspan x="498" dy="33.35">클라이언트의 기존 도구.</tspan></text>
<path d="M450 555H425" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="875" y="437" width="280" height="210" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M899 463v158" stroke="#23765b" stroke-width="5"/>
<text x="921" y="488" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="921" dy="0">Live 진행 화면</tspan></text>
<text x="921" y="531" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="921" dy="0">작업 관계와 진행 상황,</tspan><tspan x="921" dy="33.35">세부 정보와 결과 확인.</tspan></text>
<path d="M825 533H861" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"/>
<text x="875" y="694" font-size="18" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="875" dy="0">기록된 작업을 표시</tspan></text>
<text x="454" y="666" font-size="18" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="454" dy="0">Kim Service는 필요에 따라 사용</tspan></text>
<path d="M260 694V744" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="770" width="460" height="170" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M84 796v118" stroke="#23765b" stroke-width="5"/>
<text x="106" y="821" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="106" dy="0">프로젝트</tspan></text>
<text x="106" y="864" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="106" dy="0">코드와 파일,</tspan><tspan x="106" dy="33.35">저장된 작업 기록.</tspan></text>
<path d="M526 850H659" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="770" width="475" height="170" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M704 796v118" stroke="#23765b" stroke-width="5"/>
<text x="726" y="821" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="726" dy="0">다음 대화</tspan></text>
<text x="726" y="864" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="726" dy="0">목표, 결정 사항,</tspan><tspan x="726" dy="33.35">진행 상황을 이어받기.</tspan></text>
<path d="M917 768V735H425V695" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"/>
</svg>
