<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1628" viewBox="0 0 960 1628" role="img" aria-labelledby="title description" lang="zh-CN" xml:lang="zh-CN">
<title id="title">客户端和模型，分别按本次任务选择</title><desc id="description">读配置与宿主信号 → 核对真实能力 → 执行 → 留下依据 图中文字和关系完整保留。动效展示一轮输入传递、任务进度和产出保留；停止动画或减少动效时仍可读完整流程。 同一套方法可随客户端使用；实际支持以本轮证据为准。</desc>
