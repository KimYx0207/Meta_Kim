<path d="M258 1173V1225H480V1267" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m19" pathLength="1" d="M258 1173V1225H480V1267" fill="none" stroke="#2968e8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M702 1173V1225H480" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="transfer m20" pathLength="1" d="M702 1173V1225H480" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="执行后分别记录" data-box="80,1267,800,226"><rect x="80" y="1267" width="800" height="226" rx="22" fill="#edf8f6" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m21" x="80" y="1267" width="800" height="226" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="480" y="1325" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">执行后分别记录</tspan></text><text x="480" y="1381" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">请求的模型 · 已传入的模型 · 实际观察到的模型</tspan><tspan x="480" dy="42">没有实际观测证据，就保留 unknown</tspan></text></g>
