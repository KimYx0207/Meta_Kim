<g class="node" data-label="确定模型请求" data-box="500,559,404,268"><rect x="500" y="559" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m12" x="500" y="559" width="404" height="268" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="526" y="617" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="526" dy="0">确定模型请求</tspan></text><text x="526" y="673" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="526" dy="0">使用本轮模型配置</tspan><tspan x="526" dy="42">缺省交给运行环境处理</tspan><tspan x="526" dy="42">不在方法中锁定型号</tspan></text></g>
<g class="node" data-label="由适配器应用" data-box="500,905,404,268"><rect x="500" y="905" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m15" x="500" y="905" width="404" height="268" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="526" y="963" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="526" dy="0">由适配器应用</tspan></text><text x="526" y="1019" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="526" dy="0">按实际协议传入模型</tspan><tspan x="526" dy="42">不支持的请求明确报错</tspan><tspan x="526" dy="42">不暗中替换用户选择</tspan></text></g>
