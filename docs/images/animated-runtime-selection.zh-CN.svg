<text x="480" y="53" font-size="24" font-weight="700" fill="#2968e8" text-anchor="middle"><tspan x="480" dy="0">META KIM · 运行图解</tspan></text>
<text x="480" y="113" font-size="40" font-weight="750" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">客户端和模型，分别按本次任务选择</tspan></text>
<text x="480" y="175" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">读配置与宿主信号 → 核对真实能力 → 执行 → 留下依据</tspan></text>
<path d="M56 231H904" stroke="#dce5f2" stroke-width="4"/><path class="clock" pathLength="1" d="M56 231H904" stroke="#2968e8" stroke-width="4"/>
<g class="node" data-label="任务输入与当前宿主" data-box="80,255,800,226"><rect x="80" y="255" width="800" height="226" rx="22" fill="#eaf1ff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m0" x="80" y="255" width="800" height="226" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="480" y="313" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">任务输入与当前宿主</tspan></text><text x="480" y="369" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">本轮可以显式指定客户端和模型</tspan><tspan x="480" dy="42">默认值可追溯；模型名不等于客户端身份</tspan></text></g>
<path d="M480 481V521H258V559" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m3" pathLength="1" d="M480 481V521H258V559" fill="none" stroke="#2968e8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="选择执行客户端" data-box="56,559,404,268"><rect x="56" y="559" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m4" x="56" y="559" width="404" height="268" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="82" y="617" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="82" dy="0">选择执行客户端</tspan></text><text x="82" y="673" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="82" dy="0">显式选择优先</tspan><tspan x="82" dy="42">自动模式读取宿主信号</tspan><tspan x="82" dy="42">兼容默认值来自配置</tspan></text></g>
<g class="node" data-label="核对执行能力" data-box="56,905,404,268"><rect x="56" y="905" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m7" x="56" y="905" width="404" height="268" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="82" y="963" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="82" dy="0">核对执行能力</tspan></text><text x="82" y="1019" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="82" dy="0">安装发现只是线索</tspan><tspan x="82" dy="42">还要核对适配与权限</tspan><tspan x="82" dy="42">未验证支持保持未知</tspan></text></g>
