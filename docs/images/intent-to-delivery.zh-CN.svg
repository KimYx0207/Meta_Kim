<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
<title id="title">以手机注册页为例，看它怎样做完一件事</title><desc id="desc">目标说清楚，过程看得见，结果能亲手试。</desc>
<style>text{font-family:Inter, Noto Sans CJK SC, sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#23765b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1220" rx="24" fill="#f7f9f5"/>
<text x="48" y="48" font-size="19" font-weight="750" fill="#23765b" text-anchor="start"><tspan x="48" dy="0">META_KIM / 任务流程</tspan></text>
<text x="48" y="103" font-size="38" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="48" dy="0">以手机注册页为例，看它怎样做完一件事</tspan></text>
<text x="48" y="146" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="48" dy="0">目标说清楚，过程看得见，结果能亲手试。</tspan></text>
<rect x="190" y="190" width="820" height="140" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 216v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="241" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">说清想改什么</tspan></text>
<text x="236" y="284" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">手机上注册更顺手。</tspan><tspan x="236" dy="33.35">保留现在的数据字段。</tspan></text>
<path d="M600 334V368" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="190" y="385" width="820" height="140" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 411v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="436" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">先看懂现有项目</tspan></text>
<text x="236" y="479" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">阅读代码、现有流程和参考资料。</tspan><tspan x="236" dy="33.35">确定改法，以及怎样检查结果。</tspan></text>
<path d="M600 530V555H350V585" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 555H850V585" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="574" font-size="20" font-weight="500" fill="#52665e" text-anchor="middle"><tspan x="600" dy="0">彼此独立的任务可以一起推进</tspan></text>
<rect x="145" y="605" width="420" height="150" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M169 631v98" stroke="#23765b" stroke-width="5"/>
<text x="191" y="656" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="191" dy="0">调整手机布局</tspan></text>
<text x="191" y="699" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="191" dy="0">输入框、间距与尺寸。</tspan><tspan x="191" dy="33.35">让表单更好填写。</tspan></text>
<rect x="635" y="605" width="420" height="150" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M659 631v98" stroke="#23765b" stroke-width="5"/>
<text x="681" y="656" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="681" dy="0">改进操作提示</tspan></text>
<text x="681" y="699" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="681" dy="0">漏填、填错时提示清楚。</tspan><tspan x="681" dy="33.35">完成后知道下一步。</tspan></text>
<path d="M355 760V795H600V823" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M845 760V795H600" fill="none" stroke="#23765b" stroke-width="3"/>
<rect x="190" y="840" width="820" height="140" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 866v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="891" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">把完整流程试一遍</tspan></text>
<text x="236" y="934" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">检查漏填、填错和正常提交。</tspan><tspan x="236" dy="33.35">确认提交的数据字段保持一致。</tspan></text>
<path d="M600 983V1015" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="190" y="1034" width="820" height="140" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 1060v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="1085" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">打开成果，接着改</tspan></text>
<text x="236" y="1128" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">拿到修改后的代码、启动方法和检查记录。</tspan><tspan x="236" dy="33.35">保留已定的选择，下一轮继续优化。</tspan></text>
<path d="M1012 908H1120V455H1020" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"/>
<rect x="1029" y="789" width="140" height="85" rx="10" fill="#f7f9f5" stroke="#f7f9f5" stroke-width="2"/>
<text x="1100" y="822" font-size="20" font-weight="600" fill="#bb633e" text-anchor="middle"><tspan x="1100" dy="0">发现问题</tspan><tspan x="1100" dy="28.0">回到任务</tspan></text>
</svg>
