<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" lang="zh-CN" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">把一句想法，推进成可交付的结果。</title><desc id="desc">目标、依据、分工和成果，都有清楚的来路与下一步。</desc>
<style>text{font-family:Noto Sans CJK SC, Microsoft YaHei,sans-serif} path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="1000" height="850" rx="26" fill="#f3f6fb" stroke="none"/>
<text x="42" y="48" font-size="22" font-weight="750" fill="#245dd8">META_KIM</text>
<text x="958" text-anchor="end" y="48" font-size="17" font-weight="500" fill="#5c6980">工作流程示意</text>
<text x="42" y="108" font-size="39" font-weight="750" fill="#11243b">把一句想法，推进成可交付的结果。</text>
<text x="42" y="151" font-size="23" font-weight="400" fill="#435169">目标、依据、分工和成果，都有清楚的来路与下一步。</text>
<rect x="42" y="194" width="436" height="232" rx="22" fill="#ffffff" stroke="#dce4ef"/>
<rect x="66" y="218" width="44" height="42" rx="13" fill="#245dd8" stroke="none"/>
<text x="88" text-anchor="middle" y="248" font-size="23" font-weight="750" fill="#fff">01</text>
<text x="126" y="249" font-size="28" font-weight="700" fill="#11243b">说清目标</text>
<text x="66" y="298" font-size="24" font-weight="400" fill="#435169">想解决什么问题？</text>
<text x="66" y="334" font-size="24" font-weight="400" fill="#435169">怎样才算把事情做好？</text>
<rect x="58" y="357" width="404" height="54" rx="12" fill="#edf3fb" stroke="none"/>
<text x="72" y="378" font-size="16" font-weight="600" fill="#245dd8">留下什么</text>
<text x="72" y="401" font-size="21" font-weight="650" fill="#223850">目标与验收条件</text>
<rect x="520" y="194" width="436" height="232" rx="22" fill="#ffffff" stroke="#dce4ef"/>
<rect x="544" y="218" width="44" height="42" rx="13" fill="#245dd8" stroke="none"/>
<text x="566" text-anchor="middle" y="248" font-size="23" font-weight="750" fill="#fff">02</text>
<text x="604" y="249" font-size="28" font-weight="700" fill="#11243b">研究与选择</text>
<text x="544" y="298" font-size="24" font-weight="400" fill="#435169">查资料、找同类项目。</text>
<text x="544" y="334" font-size="24" font-weight="400" fill="#435169">比较路线，作出关键决定。</text>
<rect x="536" y="357" width="404" height="54" rx="12" fill="#edf3fb" stroke="none"/>
<text x="550" y="378" font-size="16" font-weight="600" fill="#245dd8">留下什么</text>
<text x="550" y="401" font-size="21" font-weight="650" fill="#223850">参考依据与方案选择</text>
<rect x="42" y="452" width="436" height="232" rx="22" fill="#ffffff" stroke="#dce4ef"/>
<rect x="66" y="476" width="44" height="42" rx="13" fill="#245dd8" stroke="none"/>
<text x="88" text-anchor="middle" y="506" font-size="23" font-weight="750" fill="#fff">03</text>
<text x="126" y="507" font-size="28" font-weight="700" fill="#11243b">规划与制作</text>
<text x="66" y="556" font-size="24" font-weight="400" fill="#435169">先定系统，再拆具体模块。</text>
<text x="66" y="592" font-size="24" font-weight="400" fill="#435169">按依赖安排先后与并行。</text>
<rect x="58" y="615" width="404" height="54" rx="12" fill="#edf3fb" stroke="none"/>
<text x="72" y="636" font-size="16" font-weight="600" fill="#245dd8">留下什么</text>
<text x="72" y="659" font-size="21" font-weight="650" fill="#223850">任务安排与交付文件</text>
<rect x="520" y="452" width="436" height="232" rx="22" fill="#ffffff" stroke="#dce4ef"/>
<rect x="544" y="476" width="44" height="42" rx="13" fill="#245dd8" stroke="none"/>
<text x="566" text-anchor="middle" y="506" font-size="23" font-weight="750" fill="#fff">04</text>
<text x="604" y="507" font-size="28" font-weight="700" fill="#11243b">检查与交付</text>
<text x="544" y="556" font-size="24" font-weight="400" fill="#435169">对照最初目标检查成果。</text>
<text x="544" y="592" font-size="24" font-weight="400" fill="#435169">记录决定和后续动作。</text>
<rect x="536" y="615" width="404" height="54" rx="12" fill="#edf3fb" stroke="none"/>
<text x="550" y="636" font-size="16" font-weight="600" fill="#245dd8">留下什么</text>
<text x="550" y="659" font-size="21" font-weight="650" fill="#223850">审查后的成果与交接说明</text>
<rect x="42" y="732" width="914" height="82" rx="18" fill="#102b43" stroke="none"/>
<text x="66" y="767" font-size="27" font-weight="650" fill="#f5f9ff">已经做好的保留，下一轮接着推进。</text>
<text x="66" y="798" font-size="20" font-weight="400" fill="#c0d9ed">任务记录保留决定与进度，后续迭代有据可循。</text>
</svg>
