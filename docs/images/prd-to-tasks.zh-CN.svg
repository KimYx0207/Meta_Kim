<text x="700" y="48" fill="#202b25" font-size="38" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">两轮 PRD 怎样变成可执行的任务</tspan></text>
<text x="700" y="85" fill="#5a655e" font-size="21" font-weight="450" text-anchor="middle"><tspan x="700" dy="0">先建立系统基线，再展开模块细节；设计、工单和验证保持同一条追溯关系</tspan></text>
<text x="256" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="256" dy="0">主流程</tspan></text>
<text x="526" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="526" dy="0">问题回退</tspan></text>
<text x="796" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="796" dy="0">人的决定</tspan></text>
<text x="1066" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="1066" dy="0">写入记录</tspan></text>
<text x="218.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="218.0" dy="0">业务目标</tspan></text>
<text x="540.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="540.0" dy="0">项目事实与证据</tspan></text>
<text x="862.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="862.0" dy="0">已有决定</tspan></text>
<text x="1184.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1184.0" dy="0">变更要求</tspan></text>
<text x="700" y="240" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Thinking 阶段：持续展开同一份 PRD</tspan></text>
<text x="1220" y="238" fill="#6756b4" font-size="20" font-weight="450" text-anchor="start"><tspan x="1220" dy="0">定位影响模块</tspan></text>
<text x="75" y="286" fill="#fff" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">第一轮 · 系统模块大纲</tspan></text>
<text x="75" y="316" fill="#d8e1d9" font-size="20" font-weight="450" text-anchor="start"><tspan x="75" dy="0">看清做什么，以及模块如何协作</tspan></text>
<text x="780" y="286" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="780" dy="0">第二轮 · 模块详细设计</tspan></text>
<text x="780" y="316" fill="#5a655e" font-size="20" font-weight="450" text-anchor="start"><tspan x="780" dy="0">沿系统基线，把模块写到可实现</tspan></text>
<text x="205.0" y="375.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">范围与用户路径</tspan></text>
<text x="205.0" y="411.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="205.0" dy="0">谁用 / 为什么用</tspan></text>
<text x="490.0" y="375.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="490.0" dy="0">架构与约束</tspan></text>
<text x="490.0" y="411.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="490.0" dy="0">应用 / 数据 / 展示</tspan></text>
<text x="205.0" y="472.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">模块边界</tspan></text>
<text x="205.0" y="508.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="205.0" dy="0">职责 / 依赖 / 取舍</tspan></text>
<text x="490.0" y="472.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="490.0" dy="0">共享接口</tspan></text>
<text x="490.0" y="508.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="490.0" dy="0">数据归属 / 成功标准</tspan></text>
<text x="910.0" y="375.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="910.0" dy="0">流程与状态</tspan></text>
<text x="910.0" y="411.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="910.0" dy="0">正常 / 空白 / 加载</tspan></text>
<text x="1195.0" y="375.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1195.0" dy="0">异常与恢复</tspan></text>
<text x="1195.0" y="411.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1195.0" dy="0">失败 / 重试 / 回退</tspan></text>
<text x="910.0" y="472.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="910.0" dy="0">规则与数据</tspan></text>
<text x="910.0" y="508.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="910.0" dy="0">输入 / 输出 / 责任</tspan></text>
<text x="1195.0" y="472.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1195.0" dy="0">接口与验收</tspan></text>
<text x="1195.0" y="508.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1195.0" dy="0">行为 / 边界 / 验证</tspan></text>
<text x="700" y="373" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">展开</tspan><tspan x="700" dy="25">选中模块</tspan></text>
<text x="75" y="620" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">可执行工单 · 引用同一份 PRD 的相应部分</tspan></text>
<text x="195.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">目标与上下文</tspan></text>
<text x="195.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="195.0" dy="0">系统基线 + 模块细节</tspan></text>
<text x="470.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="470.0" dy="0">边界与依赖</tspan></text>
<text x="470.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="470.0" dy="0">负责人 / 范围 / 前置</tspan></text>
<text x="745.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="745.0" dy="0">产物与验收</tspan></text>
<text x="745.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="745.0" dy="0">输入 / 输出 / 检查</tspan></text>
<text x="1192" y="607" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1192" dy="0">先复用已有决定</tspan></text>
<text x="1020" y="649.5" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="1020" dy="0">仍有未决</tspan><tspan x="1020" dy="25.0">取舍？</tspan></text>
<text x="1212.5" y="723.875" fill="#202b25" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1212.5" dy="0">你判断并记理由</tspan></text>
<text x="915" y="640" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="915" dy="0">否</tspan></text>
<text x="1155" y="646" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="start"><tspan x="1155" dy="0">是</tspan></text>
<text x="75" y="827" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">按依赖执行：就绪任务推进，独立任务可并行</tspan></text>
<text x="210.0" y="899.125" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="210.0" dy="0">检查依赖</tspan></text>
<text x="210.0" y="934.875" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="210.0" dy="0">就绪推进</tspan><tspan x="210.0" dy="26.0">等待留接续点</tspan></text>
<text x="537.5" y="892.0" fill="#202b25" font-size="24" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">独立任务 A</tspan></text>
<text x="537.5" y="971.0" fill="#202b25" font-size="24" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">独立任务 B</tspan></text>
<text x="880.0" y="915.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="880.0" dy="0">合并真实成果</tspan></text>
<text x="880.0" y="949.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="880.0" dy="0">统一检查与验证</tspan></text>
<text x="1205.0" y="915.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1205.0" dy="0">可交付版本</tspan></text>
<text x="1205.0" y="949.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1205.0" dy="0">证据 + 下一步</tspan></text>
<text x="1050" y="909" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1050" dy="0">通过</tspan></text>
<text x="844" y="992" fill="#6756b4" font-size="20" font-weight="700" text-anchor="middle"><tspan x="844" dy="0">发现问题，回相关任务</tspan></text>
<text x="700" y="1083" fill="#fff" font-size="26" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">交付可追溯：需求 → 模块 → 工单 → 成果与证据</tspan></text>
