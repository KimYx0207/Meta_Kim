<title id="title">Shared foundations, local expertise</title><desc id="description">Each project owns its professional rules and tools All text and relationships stay visible. Motion demonstrates inputs, progress and retained outputs. The complete diagram remains readable with animation off or reduced motion. Reload local capabilities for each task. Review upstream changes against the recorded baseline.</desc>
