<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">From intent to delivery with Meta_Kim and Kim Service</title><desc id="desc">Meta_Kim connects an initial goal, evidence and meaningful choices to one PRD with an architecture view and module view. Its dependency graph coordinates specialist work, review and verification. Kim Service supplies professional methods and knowledge. Reviewed lessons can improve future work. This is an architecture illustration, not a runtime screenshot.</desc>
