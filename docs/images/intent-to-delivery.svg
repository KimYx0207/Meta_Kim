<text x="64" y="701" class="title" font-size="25">Module A</text><text x="64" y="732" class="body" font-size="21">Owner + method</text><text x="64" y="761" class="body" font-size="21">Project material</text>
<text x="424" y="701" class="title" font-size="25">Module B</text><text x="424" y="732" class="body" font-size="21">Owner + method</text><text x="424" y="761" class="body" font-size="21">Project material</text>
