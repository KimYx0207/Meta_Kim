<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1016" viewBox="0 0 760 1016" lang="en" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">From intent to delivery</title><desc id="desc">Meta_Kim turns a goal into research, choices, two PRD views and coordinated work. Kim Service supplies professional methods. Ready independent tasks run in parallel, then results are reviewed. This diagram explains the workflow.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#7996ba" stroke-width="1.5"/></marker><style>text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{fill:#f4f7ff;font-weight:700}.body{fill:#bfcde2}.accent{fill:#8ce4d7;font-weight:700}.card{fill:#14233c;stroke:#344e70;stroke-width:1.5}.design{fill:#242140;stroke:#7d6bba;stroke-width:1.5}.methods{fill:#0f3035;stroke:#398b85;stroke-width:1.5}.result{fill:#192f4b;stroke:#5485b8;stroke-width:1.5}.line{fill:none;stroke:#7996ba;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="760" height="1016" rx="24" fill="#091426"/>
