<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="en" xml:lang="en">
<title id="title">A better registration flow, one step at a time</title><desc id="desc">One concrete goal. Work that can be followed, checked and continued.</desc>
<style>text{font-family:Inter, Noto Sans, sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#23765b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1220" rx="24" fill="#f7f9f5"/>
<text x="48" y="48" font-size="19" font-weight="750" fill="#23765b" text-anchor="start"><tspan x="48" dy="0">META_KIM / A TASK WALKTHROUGH</tspan></text>
<text x="48" y="103" font-size="38" font-weight="750" fill="#17372f" text-anchor="start"><tspan x="48" dy="0">A better registration flow, one step at a time</tspan></text>
<text x="48" y="146" font-size="24" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="48" dy="0">One concrete goal. Work that can be followed, checked and continued.</tspan></text>
<rect x="190" y="190" width="820" height="140" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 216v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="241" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">Your goal</tspan></text>
<text x="236" y="284" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">Make registration easier on mobile.</tspan><tspan x="236" dy="33.35">Keep the same data fields.</tspan></text>
<path d="M600 334V368" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="190" y="385" width="820" height="140" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 411v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="436" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">Understand the project</tspan></text>
<text x="236" y="479" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">Read the existing flow and references.</tspan><tspan x="236" dy="33.35">Agree on the approach and checks.</tspan></text>
<path d="M600 530V555H350V585" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 555H850V585" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="574" font-size="20" font-weight="500" fill="#52665e" text-anchor="middle"><tspan x="600" dy="0">Independent work can run together</tspan></text>
<rect x="145" y="605" width="420" height="150" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M169 631v98" stroke="#23765b" stroke-width="5"/>
<text x="191" y="656" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="191" dy="0">Mobile layout</tspan></text>
<text x="191" y="699" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="191" dy="0">Space, sizing and</tspan><tspan x="191" dy="33.35">a usable form.</tspan></text>
<rect x="635" y="605" width="420" height="150" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M659 631v98" stroke="#23765b" stroke-width="5"/>
<text x="681" y="656" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="681" dy="0">Clear feedback</tspan></text>
<text x="681" y="699" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="681" dy="0">Helpful field errors</tspan><tspan x="681" dy="33.35">and a clear success state.</tspan></text>
<path d="M355 760V795H600V823" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M845 760V795H600" fill="none" stroke="#23765b" stroke-width="3"/>
<rect x="190" y="840" width="820" height="140" rx="18" fill="white" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 866v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="891" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">Check the whole flow</tspan></text>
<text x="236" y="934" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">Try missing, invalid and valid inputs.</tspan><tspan x="236" dy="33.35">Confirm the submitted fields stay the same.</tspan></text>
<path d="M600 983V1015" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="190" y="1034" width="820" height="140" rx="18" fill="#e7f1e9" stroke="#cedbd1" stroke-width="2"/>
<path d="M214 1060v88" stroke="#23765b" stroke-width="5"/>
<text x="236" y="1085" font-size="29" font-weight="700" fill="#17372f" text-anchor="start"><tspan x="236" dy="0">Open the result</tspan></text>
<text x="236" y="1128" font-size="23" font-weight="450" fill="#52665e" text-anchor="start"><tspan x="236" dy="0">Updated code, launch steps and checks.</tspan><tspan x="236" dy="33.35">Carry the decisions into the next iteration.</tspan></text>
<path d="M1012 908H1120V455H1020" fill="none" stroke="#23765b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"/>
<rect x="1029" y="789" width="140" height="85" rx="10" fill="#f7f9f5" stroke="#f7f9f5" stroke-width="2"/>
<text x="1100" y="822" font-size="20" font-weight="600" fill="#bb633e" text-anchor="middle"><tspan x="1100" dy="0">Review</tspan><tspan x="1100" dy="28.0">and refine</tspan></text>
</svg>
