<title id="title">Choose the client and model separately</title><desc id="description">Configuration + host signals → capability checks → execution → evidence All text and relationships stay visible. Motion demonstrates inputs, progress and retained outputs. The complete diagram remains readable with animation off or reduced motion. Portable methods. Real capabilities need evidence.</desc>
