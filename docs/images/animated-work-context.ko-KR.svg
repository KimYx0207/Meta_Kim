<title id="title">같은 일을 다음 대화로 이어가기</title><desc id="description">업무 시스템이 같은 업무 식별자로 여러 실행을 연결 모든 글과 관계를 항상 표시합니다. 애니메이션은 입력 전달, 진행 상태, 결과 보존을 설명합니다. 동작을 꺼도 전체 흐름을 읽을 수 있습니다. 채택과 효과는 업무 시스템 기록을 사용,경험은 평가 후 재사용합니다</desc>
