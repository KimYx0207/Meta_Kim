<title id="title">Rhythm: show what matters now</title><desc id="description">First decide whether new information deserves attention · Choose the response that fits the current condition All text and relationships stay visible. Motion demonstrates inputs, progress and retained outputs. The complete diagram remains readable with animation off or reduced motion. Clarify, Options, Execute, Verify and other cards follow conditions.</desc>
