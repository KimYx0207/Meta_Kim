<title id="title">Dynamic work follows dependencies</title><desc id="description">An illustrative branch inside one Execution stage All text and relationships stay visible. Motion demonstrates inputs, progress and retained outputs. The complete diagram remains readable with animation off or reduced motion. Shared write conflicts serialize; concurrency uses actual host capacity.</desc>
