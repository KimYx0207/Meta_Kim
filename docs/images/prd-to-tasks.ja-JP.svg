<g data-box="1100,886,210,75" data-label="引き渡せる版"><rect x="1100" y="886" width="210" height="75" rx="9" fill="#fff" stroke="#aeb7af" stroke-width="1.4"/></g>
<text x="700" y="48" fill="#202b25" font-size="38" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">2 回の PRD 設計から実行可能なタスクへ</tspan></text>
<text x="700" y="85" fill="#5a655e" font-size="21" font-weight="450" text-anchor="middle"><tspan x="700" dy="0">全体の基準を定め、モジュールを具体化し、設計・工票・検証をつなぐ</tspan></text>
<text x="256" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="256" dy="0">主な流れ</tspan></text>
<text x="526" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="526" dy="0">修正・差し戻し</tspan></text>
<text x="796" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="796" dy="0">人の判断</tspan></text>
<text x="1066" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="1066" dy="0">記録への書き込み</tspan></text>
<text x="218.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="218.0" dy="0">業務の目的</tspan></text>
<text x="540.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="540.0" dy="0">プロジェクトの事実と根拠</tspan></text>
<text x="862.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="862.0" dy="0">既存の決定</tspan></text>
<text x="1184.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1184.0" dy="0">要求の変更</tspan></text>
<text x="700" y="240" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Thinking：同じ PRD を 2 回に分けて具体化</tspan></text>
<text x="1220" y="238" fill="#6756b4" font-size="20" font-weight="450" text-anchor="start"><tspan x="1220" dy="0">影響を特定</tspan></text>
<text x="75" y="286" fill="#fff" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">第 1 回 · システム構成</tspan></text>
<text x="75" y="316" fill="#d8e1d9" font-size="20" font-weight="450" text-anchor="start"><tspan x="75" dy="0">何を作り、モジュールがどう連携するか</tspan></text>
<text x="780" y="286" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="780" dy="0">第 2 回 · モジュール詳細</tspan></text>
<text x="780" y="316" fill="#5a655e" font-size="20" font-weight="450" text-anchor="start"><tspan x="780" dy="0">全体設計の中で実装可能な仕様へ進める</tspan></text>
<text x="205.0" y="375.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">範囲と利用経路</tspan></text>
<text x="205.0" y="411.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="205.0" dy="0">誰が / 何のために</tspan></text>
<text x="490.0" y="375.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="490.0" dy="0">構成と制約</tspan></text>
<text x="490.0" y="411.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="490.0" dy="0">アプリ / データ / 表示</tspan></text>
<text x="205.0" y="472.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">モジュールの境界</tspan></text>
<text x="205.0" y="508.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="205.0" dy="0">責任 / 依存 / 選択</tspan></text>
<text x="490.0" y="472.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="490.0" dy="0">共有インターフェース</tspan></text>
<text x="490.0" y="508.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="490.0" dy="0">データ所有 / 成功条件</tspan></text>
<text x="910.0" y="375.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="910.0" dy="0">フローと状態</tspan></text>
<text x="910.0" y="411.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="910.0" dy="0">通常 / 空 / 読込中</tspan></text>
<text x="1195.0" y="375.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1195.0" dy="0">例外と復旧</tspan></text>
<text x="1195.0" y="411.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1195.0" dy="0">失敗 / 再試行 / 復帰</tspan></text>
<text x="910.0" y="472.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="910.0" dy="0">規則とデータ</tspan></text>
<text x="910.0" y="508.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="910.0" dy="0">入力 / 出力 / 責任</tspan></text>
<text x="1195.0" y="472.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1195.0" dy="0">接続と受入条件</tspan></text>
<text x="1195.0" y="508.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1195.0" dy="0">動作 / 境界 / 検証</tspan></text>
<text x="700" y="373" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">選択した</tspan><tspan x="700" dy="25">部分を展開</tspan></text>
<text x="75" y="620" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">実行可能な工票 · 同じ PRD の該当部分を参照</tspan></text>
<text x="195.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">目的と文脈</tspan></text>
<text x="195.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="195.0" dy="0">全体の基準 + 詳細</tspan></text>
<text x="470.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="470.0" dy="0">境界と依存</tspan></text>
<text x="470.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="470.0" dy="0">担当 / 範囲 / 前提</tspan></text>
<text x="745.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="745.0" dy="0">成果と受入条件</tspan></text>
<text x="745.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="745.0" dy="0">入力 / 出力 / 確認</tspan></text>
<text x="1192" y="607" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1192" dy="0">既存の決定を先に使う</tspan></text>
<text x="1020" y="649.5" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="1020" dy="0">人の判断が</tspan><tspan x="1020" dy="25.0">まだ必要？</tspan></text>
<text x="1212.5" y="723.875" fill="#202b25" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1212.5" dy="0">判断と理由を記録</tspan></text>
<text x="915" y="640" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="915" dy="0">いいえ</tspan></text>
<text x="1155" y="646" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="start"><tspan x="1155" dy="0">はい</tspan></text>
<text x="75" y="827" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">依存関係に沿って実行：準備済みの独立タスクは並行可能</tspan></text>
<text x="210.0" y="899.125" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="210.0" dy="0">依存関係を確認</tspan></text>
<text x="210.0" y="934.875" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="210.0" dy="0">準備できれば実行</tspan><tspan x="210.0" dy="26.0">待機は再開点を残す</tspan></text>
<text x="537.5" y="892.0" fill="#202b25" font-size="24" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">独立したタスク A</tspan></text>
<text x="537.5" y="971.0" fill="#202b25" font-size="24" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">独立したタスク B</tspan></text>
<text x="880.0" y="915.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="880.0" dy="0">実際の成果を統合</tspan></text>
<text x="880.0" y="949.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="880.0" dy="0">まとめて検証する</tspan></text>
<text x="1205.0" y="915.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1205.0" dy="0">引き渡せる版</tspan></text>
<text x="1205.0" y="949.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1205.0" dy="0">根拠 + 次の一手</tspan></text>
<text x="1050" y="909" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1050" dy="0">合格</tspan></text>
<text x="844" y="992" fill="#6756b4" font-size="20" font-weight="700" text-anchor="middle"><tspan x="844" dy="0">問題は該当タスクへ戻す</tspan></text>
<text x="700" y="1083" fill="#fff" font-size="26" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">追跡できる成果：要求 → モジュール → 工票 → 成果と根拠</tspan></text>
</svg>
