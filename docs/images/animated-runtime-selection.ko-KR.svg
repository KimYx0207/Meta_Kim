<title id="title">클라이언트와 모델을 따로 선택하기</title><desc id="description">설정과 호스트 신호 → 실제 기능 확인 → 실행 → 근거 기록 모든 글과 관계를 항상 표시합니다. 애니메이션은 입력 전달, 진행 상태, 결과 보존을 설명합니다. 동작을 꺼도 전체 흐름을 읽을 수 있습니다. 클라이언트가 바뀌어도 같은 방법을 사용하며 실제 기능은 증거로 확인합니다.</desc>
