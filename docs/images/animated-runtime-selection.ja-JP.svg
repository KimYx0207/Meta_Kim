<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1709" viewBox="0 0 960 1709" role="img" aria-labelledby="title description" lang="ja-JP" xml:lang="ja-JP">
<title id="title">クライアントとモデルを別々に選ぶ</title><desc id="description">設定とホスト情報 → 能力の確認 → 実行 → 根拠を記録 文字と関係は常に表示します。アニメーションは入力の受け渡し、進捗、成果の保存を示します。動作を止めても全体を読めます。 同じ方法を別のクライアントへ。実行可能かは対応と証拠で判断する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#cad7e8" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="back-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c56d8" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
