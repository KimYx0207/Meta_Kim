<rect width="960" height="1709" rx="26" fill="#f5f8fc"/>
<text x="480" y="53" font-size="24" font-weight="700" fill="#2968e8" text-anchor="middle"><tspan x="480" dy="0">META KIM · 仕組みの図解</tspan></text>
<text x="480" y="113" font-size="40" font-weight="750" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">クライアントとモデルを別々に選ぶ</tspan></text>
<text x="480" y="175" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">設定とホスト情報 → 能力の確認 → 実行 → 根拠を記録</tspan></text>
<path d="M56 231H904" stroke="#dce5f2" stroke-width="4"/><path class="clock" pathLength="1" d="M56 231H904" stroke="#2968e8" stroke-width="4"/>
<g class="node" data-label="依頼の入力と現在のホスト" data-box="80,255,800,268"><rect x="80" y="255" width="800" height="268" rx="22" fill="#eaf1ff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m0" x="80" y="255" width="800" height="268" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="480" y="313" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">依頼の入力と現在のホスト</tspan></text><text x="480" y="369" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">クライアントとモデルを指定</tspan><tspan x="480" dy="42">省略時の既定値も出所を記録</tspan><tspan x="480" dy="42">モデル名からクライアントを推測しない</tspan></text></g>
<path d="M480 523V563H258V601" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m3" pathLength="1" d="M480 523V563H258V601" fill="none" stroke="#2968e8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="クライアントを選択" data-box="56,601,404,268"><rect x="56" y="601" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m4" x="56" y="601" width="404" height="268" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="82" y="659" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="82" dy="0">クライアントを選択</tspan></text><text x="82" y="715" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="82" dy="0">明示指定を優先</tspan><tspan x="82" dy="42">自動はホスト情報から</tspan><tspan x="82" dy="42">既定値は設定から</tspan></text></g>
<g class="node" data-label="実行能力を確認" data-box="56,947,404,268"><rect x="56" y="947" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m7" x="56" y="947" width="404" height="268" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="82" y="1005" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="82" dy="0">実行能力を確認</tspan></text><text x="82" y="1061" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="82" dy="0">導入済みは手掛かり</tspan><tspan x="82" dy="42">連携と権限も確認</tspan><tspan x="82" dy="42">未検証は不明のまま</tspan></text></g>
<path d="M258 869V947" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m10" pathLength="1" d="M258 869V947" fill="none" stroke="#2968e8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M480 523V563H702V601" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m11" pathLength="1" d="M480 523V563H702V601" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="モデルの要求を決定" data-box="500,601,404,268"><rect x="500" y="601" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m12" x="500" y="601" width="404" height="268" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="526" y="659" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="526" dy="0">モデルの要求を決定</tspan></text><text x="526" y="715" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="526" dy="0">今回の設定を使用</tspan><tspan x="526" dy="42">省略時は環境に委任</tspan><tspan x="526" dy="42">型番を方法に固定せず</tspan></text></g>
<g class="node" data-label="連携機能で適用" data-box="500,947,404,268"><rect x="500" y="947" width="404" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m15" x="500" y="947" width="404" height="268" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="526" y="1005" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="526" dy="0">連携機能で適用</tspan></text><text x="526" y="1061" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="526" dy="0">仕様に沿って適用</tspan><tspan x="526" dy="42">未対応は明示する</tspan><tspan x="526" dy="42">指定を勝手に変えない</tspan></text></g>
<path d="M702 869V947" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m18" pathLength="1" d="M702 869V947" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M258 1215V1267H480V1309" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m19" pathLength="1" d="M258 1215V1267H480V1309" fill="none" stroke="#2968e8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M702 1215V1267H480" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="transfer m20" pathLength="1" d="M702 1215V1267H480" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="実行後、別々に記録する" data-box="80,1309,800,226"><rect x="80" y="1309" width="800" height="226" rx="22" fill="#edf8f6" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m21" x="80" y="1309" width="800" height="226" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="480" y="1367" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">実行後、別々に記録する</tspan></text><text x="480" y="1423" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">要求・適用・実測のモデルを区別して記録</tspan><tspan x="480" dy="42">観測の証拠がなければ unknown を保持</tspan></text></g>
<path d="M56 1570H904" stroke="#cad7e8"/>
<text x="480" y="1617" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">同じ方法を別のクライアントへ。実行可能かは対応と証拠</tspan><tspan x="480" dy="39">で判断する。</tspan></text>
</svg>
