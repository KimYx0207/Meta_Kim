<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1618" viewBox="0 0 960 1618" role="img" aria-labelledby="title description" lang="ja-JP" xml:lang="ja-JP">
<title id="title">アプリ、データ、表示の責任を分ける</title><desc id="description">一つの依頼で、設定・実行・記録・画面をつなぐ 文字と関係は常に表示します。アニメーションは入力の受け渡し、進捗、成果の保存を示します。動作を止めても全体を読めます。 共通の方法は一か所で管理。表示層は結果を読み取る。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#cad7e8" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="back-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c56d8" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>text{font-family:"Noto Sans CJK JP","Yu Gothic",Arial,sans-serif}.clock{stroke-dasharray:1;stroke-dashoffset:0;animation:clock 32s linear infinite}@keyframes clock{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes m0{0%,1%{opacity:0}2.2%,11.8%{opacity:1}13%,100%{opacity:0}}.m0{opacity:0;animation:m0 32s ease-in-out infinite}
@keyframes m1{0%,13%{opacity:0}14.5%,100%{opacity:1}}.m1{opacity:1;animation:m1 32s ease-in-out infinite}
@keyframes m2{0%,1%{transform:scaleX(0)}13%,100%{transform:scaleX(1)}}.m2{transform:scaleX(1);transform-box:fill-box;transform-origin:left center;animation:m2 32s ease-in-out infinite}
@keyframes m3{0%,14.000000000000002%{opacity:0}15.200000000000001%,26.800000000000004%{opacity:1}28.000000000000004%,100%{opacity:0}}.m3{opacity:0;animation:m3 32s ease-in-out infinite}
@keyframes m4{0%,28.000000000000004%{opacity:0}29.500000000000004%,100%{opacity:1}}.m4{opacity:1;animation:m4 32s ease-in-out infinite}
@keyframes m5{0%,14.000000000000002%{transform:scaleX(0)}28.000000000000004%,100%{transform:scaleX(1)}}.m5{transform:scaleX(1);transform-box:fill-box;transform-origin:left center;animation:m5 32s ease-in-out infinite}
@keyframes m6{0%,9%{stroke-dashoffset:1;opacity:0}10%{opacity:1}17%,100%{stroke-dashoffset:0;opacity:.8}}.m6{stroke-dashoffset:0;opacity:.65;animation:m6 32s ease-in-out infinite}
@keyframes m7{0%,25%{stroke-dashoffset:1;opacity:0}26%{opacity:1}35%,100%{stroke-dashoffset:0;opacity:.8}}.m7{stroke-dashoffset:0;opacity:.65;animation:m7 32s ease-in-out infinite}
@keyframes m8{0%,41%{stroke-dashoffset:1;opacity:0}42%{opacity:1}55.00000000000001%,100%{stroke-dashoffset:0;opacity:.8}}.m8{stroke-dashoffset:0;opacity:.65;animation:m8 32s ease-in-out infinite}
@keyframes m9{0%,56.00000000000001%{stroke-dashoffset:1;opacity:0}57.00000000000001%{opacity:1}65%,100%{stroke-dashoffset:0;opacity:.8}}.m9{stroke-dashoffset:0;opacity:.65;animation:m9 32s ease-in-out infinite}
@keyframes m10{0%,61%{opacity:0}62.2%,74.8%{opacity:1}76%,100%{opacity:0}}.m10{opacity:0;animation:m10 32s ease-in-out infinite}
@keyframes m11{0%,76%{opacity:0}77.5%,100%{opacity:1}}.m11{opacity:1;animation:m11 32s ease-in-out infinite}
