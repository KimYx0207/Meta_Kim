@keyframes m13{0%,31%{opacity:0}32.2%,46.8%{opacity:1}48%,100%{opacity:0}}.m13{opacity:0;animation:m13 32s ease-in-out infinite}
@keyframes m14{0%,48%{opacity:0}49.5%,100%{opacity:1}}.m14{opacity:1;animation:m14 32s ease-in-out infinite}
@keyframes m15{0%,31%{transform:scaleX(0)}48%,100%{transform:scaleX(1)}}.m15{transform:scaleX(1);transform-box:fill-box;transform-origin:left center;animation:m15 32s ease-in-out infinite}
@keyframes m16{0%,78%{opacity:0}79.2%,93.8%{opacity:1}95%,100%{opacity:0}}.m16{opacity:0;animation:m16 32s ease-in-out infinite}
@keyframes m17{0%,95%{opacity:0}96.5%,100%{opacity:1}}.m17{opacity:1;animation:m17 32s ease-in-out infinite}
@keyframes m18{0%,78%{transform:scaleX(0)}95%,100%{transform:scaleX(1)}}.m18{transform:scaleX(1);transform-box:fill-box;transform-origin:left center;animation:m18 32s ease-in-out infinite}
@keyframes m19{0%,72%{stroke-dashoffset:1;opacity:0}73%{opacity:1}83%,100%{stroke-dashoffset:0;opacity:.8}}.m19{stroke-dashoffset:0;opacity:.65;animation:m19 32s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.focus,.clock{display:none}.completed{opacity:1}.progress{transform:scaleX(1)}.transfer{stroke-dashoffset:0;opacity:.45}}</style>
<rect width="960" height="1618" rx="26" fill="#f5f8fc"/>
<text x="480" y="53" font-size="24" font-weight="700" fill="#2968e8" text-anchor="middle"><tspan x="480" dy="0">META KIM · 仕組みの図解</tspan></text>
<text x="480" y="113" font-size="40" font-weight="750" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">アプリ、データ、表示の責任を分ける</tspan></text>
<text x="480" y="175" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">一つの依頼で、設定・実行・記録・画面をつなぐ</tspan></text>
<path d="M56 231H904" stroke="#dce5f2" stroke-width="4"/><path class="clock" pathLength="1" d="M56 231H904" stroke="#2968e8" stroke-width="4"/>
<g class="node" data-label="事実の種類ごとに、正本を一つにする" data-box="80,255,800,226"><rect x="80" y="255" width="800" height="226" rx="22" fill="#eaf1ff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m0" x="80" y="255" width="800" height="226" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="480" y="313" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">事実の種類ごとに、正本を一つにする</tspan></text><text x="480" y="369" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">canonical/ に共通の方法を保存</tspan><tspan x="480" dy="42">config/ に段階・方針・連携の契約を保存</tspan></text></g>
<g class="node" data-label="アプリケーション層" data-box="80,557,800,226"><rect x="80" y="557" width="800" height="226" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m3" x="80" y="557" width="800" height="226" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="480" y="615" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">アプリケーション層</tspan></text><text x="480" y="671" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">目標、八つの段階、作業の依存関係を整理</tspan><tspan x="480" dy="42">再開点を残し、実行と検証の結果を集約</tspan></text></g>
<path d="M480 481V557" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m6" pathLength="1" d="M480 481V557" fill="none" stroke="#2968e8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M700 783V895" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m7" pathLength="1" d="M700 783V895" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M896 1029H930V670H880" fill="none" stroke="#7c56d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8" marker-end="url(#back-arrow)"/><path class="transfer m8" pathLength="1" d="M896 1029H930V670H880" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M260 783V895" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m9" pathLength="1" d="M260 783V895" fill="none" stroke="#0d9488" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="842" font-size="26" font-weight="450" fill="#7c56d8" text-anchor="middle"><tspan x="480" dy="0">実行結果を返す</tspan></text>
<g class="node" data-label="データ層" data-box="64,895,392,268"><rect x="64" y="895" width="392" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m10" x="64" y="895" width="392" height="268" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="90" y="953" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="90" dy="0">データ層</tspan></text><text x="90" y="1009" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="90" dy="0">実行・証拠・案件参照</tspan><tspan x="90" dy="42">現在と過去を保存</tspan><tspan x="90" dy="42">再開と結果確認の根拠</tspan></text></g>
<g class="node" data-label="ホスト連携層" data-box="504,895,392,268"><rect x="504" y="895" width="392" height="268" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m13" x="504" y="895" width="392" height="268" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="530" y="953" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="530" dy="0">ホスト連携層</tspan></text><text x="530" y="1009" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="530" dy="0">検証済み能力で実行</tspan><tspan x="530" dy="42">モデル・道具はホスト</tspan><tspan x="530" dy="42">実際の結果を上の層へ</tspan></text></g>
<g class="node" data-label="表示層" data-box="80,1257,800,226"><rect x="80" y="1257" width="800" height="226" rx="22" fill="#edf8f6" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m16" x="80" y="1257" width="800" height="226" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="480" y="1315" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">表示層</tspan></text><text x="480" y="1371" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">Live・実行画面・README が状態と根拠を表示</tspan><tspan x="480" dy="42">結果を読み、選択方針は設定に置く</tspan></text></g>
<path d="M260 1163V1215H480V1257" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m19" pathLength="1" d="M260 1163V1215H480V1257" fill="none" stroke="#0d9488" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M56 1518H904" stroke="#cad7e8"/>
<text x="480" y="1565" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">共通の方法は一か所で管理。表示層は結果を読み取る。</tspan></text>
</svg>
