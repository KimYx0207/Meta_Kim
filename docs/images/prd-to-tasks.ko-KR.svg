<text x="700" y="48" fill="#202b25" font-size="38" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">두 차례 PRD 설계를 실행 작업으로 바꾸는 과정</tspan></text>
<text x="700" y="85" fill="#5a655e" font-size="21" font-weight="450" text-anchor="middle"><tspan x="700" dy="0">시스템 기준을 세우고 모듈을 구체화하며, 설계 · 작업 · 검증을 하나로 연결합니다</tspan></text>
<text x="256" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="256" dy="0">주 흐름</tspan></text>
<text x="526" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="526" dy="0">수정 / 되돌림</tspan></text>
<text x="796" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="796" dy="0">사람의 결정</tspan></text>
<text x="1066" y="124" fill="#202b25" font-size="20" font-weight="450" text-anchor="start"><tspan x="1066" dy="0">기록 저장</tspan></text>
<text x="218.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="218.0" dy="0">비즈니스 목표</tspan></text>
<text x="540.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="540.0" dy="0">프로젝트 사실과 근거</tspan></text>
<text x="862.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="862.0" dy="0">기존 결정</tspan></text>
<text x="1184.0" y="187.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1184.0" dy="0">변경 요구</tspan></text>
<text x="700" y="240" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Thinking: 하나의 PRD를 두 차례 구체화</tspan></text>
<text x="1220" y="238" fill="#6756b4" font-size="20" font-weight="450" text-anchor="start"><tspan x="1220" dy="0">영향 추적</tspan></text>
<text x="75" y="286" fill="#fff" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">1차 · 시스템과 모듈 개요</tspan></text>
<text x="75" y="316" fill="#d8e1d9" font-size="20" font-weight="450" text-anchor="start"><tspan x="75" dy="0">무엇을 만들고 모듈이 어떻게 협력하는가</tspan></text>
<text x="780" y="286" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="780" dy="0">2차 · 모듈 상세 설계</tspan></text>
<text x="780" y="316" fill="#5a655e" font-size="20" font-weight="450" text-anchor="start"><tspan x="780" dy="0">시스템 기준 안에서 구현 가능한 설계로</tspan></text>
<text x="205.0" y="375.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">범위와 사용자 경로</tspan></text>
<text x="205.0" y="411.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="205.0" dy="0">누가 / 왜 사용하는가</tspan></text>
<text x="490.0" y="375.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="490.0" dy="0">구조와 제약</tspan></text>
<text x="490.0" y="411.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="490.0" dy="0">애플리케이션 / 데이터 / UI</tspan></text>
<text x="205.0" y="472.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">모듈 경계</tspan></text>
<text x="205.0" y="508.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="205.0" dy="0">역할 / 의존성 / 선택</tspan></text>
<text x="490.0" y="472.625" fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="490.0" dy="0">공유 인터페이스</tspan></text>
<text x="490.0" y="508.375" fill="#fff" font-size="20" font-weight="450" text-anchor="middle"><tspan x="490.0" dy="0">데이터 소유 / 성공 기준</tspan></text>
<text x="910.0" y="375.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="910.0" dy="0">흐름과 상태</tspan></text>
<text x="910.0" y="411.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="910.0" dy="0">정상 / 빈 상태 / 로딩</tspan></text>
<text x="1195.0" y="375.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1195.0" dy="0">예외와 복구</tspan></text>
<text x="1195.0" y="411.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1195.0" dy="0">실패 / 재시도 / 복귀</tspan></text>
<text x="910.0" y="472.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="910.0" dy="0">규칙과 데이터</tspan></text>
<text x="910.0" y="508.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="910.0" dy="0">입력 / 출력 / 책임</tspan></text>
<text x="1195.0" y="472.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1195.0" dy="0">인터페이스와 인수</tspan></text>
<text x="1195.0" y="508.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1195.0" dy="0">동작 / 경계 / 검증</tspan></text>
<text x="700" y="373" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">선택 모듈</tspan><tspan x="700" dy="25">구체화</tspan></text>
<text x="75" y="620" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">실행 작업 지시서 · 같은 PRD의 해당 부분 참조</tspan></text>
<text x="195.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">목표와 맥락</tspan></text>
<text x="195.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="195.0" dy="0">시스템 기준 + 모듈 상세</tspan></text>
<text x="470.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="470.0" dy="0">범위와 의존성</tspan></text>
<text x="470.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="470.0" dy="0">담당 / 범위 / 선행 조건</tspan></text>
<text x="745.0" y="678.625" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="745.0" dy="0">산출물과 인수 조건</tspan></text>
<text x="745.0" y="714.375" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="745.0" dy="0">입력 / 출력 / 확인</tspan></text>
<text x="1192" y="607" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1192" dy="0">기존 결정을 먼저 재사용</tspan></text>
<text x="1020" y="649.5" fill="#202b25" font-size="20" font-weight="700" text-anchor="middle"><tspan x="1020" dy="0">판단이 아직</tspan><tspan x="1020" dy="25.0">필요한가?</tspan></text>
<text x="1212.5" y="723.875" fill="#202b25" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1212.5" dy="0">판단과 이유 기록</tspan></text>
<text x="915" y="640" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="915" dy="0">아니요</tspan></text>
<text x="1155" y="646" fill="#b96b2a" font-size="20" font-weight="450" text-anchor="start"><tspan x="1155" dy="0">예</tspan></text>
<text x="75" y="827" fill="#202b25" font-size="26" font-weight="700" text-anchor="start"><tspan x="75" dy="0">의존성에 따라 실행: 준비된 독립 작업은 병렬로 진행</tspan></text>
<text x="210.0" y="899.125" fill="#202b25" font-size="23" font-weight="700" text-anchor="middle"><tspan x="210.0" dy="0">의존성 확인</tspan></text>
<text x="210.0" y="934.875" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="210.0" dy="0">준비되면 실행</tspan><tspan x="210.0" dy="26.0">대기 시 재개 지점 기록</tspan></text>
<text x="537.5" y="892.0" fill="#202b25" font-size="24" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">독립 작업 A</tspan></text>
<text x="537.5" y="971.0" fill="#202b25" font-size="24" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">독립 작업 B</tspan></text>
<text x="880.0" y="915.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="880.0" dy="0">실제 결과 통합</tspan></text>
<text x="880.0" y="949.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="880.0" dy="0">함께 확인하고 검증</tspan></text>
<text x="1205.0" y="915.25" fill="#202b25" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1205.0" dy="0">전달 가능한 버전</tspan></text>
<text x="1205.0" y="949.75" fill="#5a655e" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1205.0" dy="0">근거 + 다음 단계</tspan></text>
<text x="1050" y="909" fill="#202b25" font-size="20" font-weight="450" text-anchor="middle"><tspan x="1050" dy="0">통과</tspan></text>
<text x="844" y="992" fill="#6756b4" font-size="20" font-weight="700" text-anchor="middle"><tspan x="844" dy="0">문제 발견 시 해당 작업으로</tspan></text>
<text x="700" y="1083" fill="#fff" font-size="26" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">추적 가능한 전달: 요구 → 모듈 → 작업 → 결과와 근거</tspan></text>
</svg>
