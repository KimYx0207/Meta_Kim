<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc" lang="ko-KR"><title id="title">두 차례 PRD 설계를 실행 작업으로 바꾸는 과정</title><desc id="desc">계획, 실행, 검증, 사람의 판단, 되돌림과 기록 위치를 화살표로 보여 주는 시스템 구성도.</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><marker id="main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#46544a"/></marker><marker id="human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#b96b2a"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#6756b4"/></marker><marker id="record" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#737b75"/></marker><marker id="light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#d8e1d9"/></marker></defs>
