<text x="56" y="113" font-size="40" font-weight="750" fill="#17263f" text-anchor="start"><tspan x="56" dy="0">리듬과 여백: 필요한 때에 전달</tspan></text>
<text x="56" y="175" font-size="30" font-weight="450" fill="#566782" text-anchor="start"><tspan x="56" dy="0">새 정보가 지금 사용자의 주의를 필요로 하는지 판단 · 현재</tspan><tspan x="56" dy="39">조건에 맞는 대응 선택</tspan></text>
