<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2049" viewBox="0 0 960 2049" role="img" aria-labelledby="title description" lang="ko-KR" xml:lang="ko-KR">
<title id="title">리듬과 여백: 필요한 때에 전달</title><desc id="description">새 정보가 지금 사용자의 주의를 필요로 하는지 판단 · 현재 조건에 맞는 대응 선택 모든 글과 관계를 항상 표시합니다. 애니메이션은 입력 전달, 진행 상태, 결과 보존을 설명합니다. 동작을 꺼도 전체 흐름을 읽을 수 있습니다. Clarify, Options, Execute, Verify 등의 카드를 조건에 맞게 배치합니다.</desc>
