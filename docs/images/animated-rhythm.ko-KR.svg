<g class="node" data-label="조건이 명확해지면 계속" data-box="80,1649,800,226"><rect x="80" y="1649" width="800" height="226" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m22" x="80" y="1649" width="800" height="226" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="106" y="1707" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="106" dy="0">조건이 명확해지면 계속</tspan></text><text x="106" y="1763" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="106" dy="0">중단 이유와 재개 조건을 기록하고 독립적인 승인</tspan><tspan x="106" dy="42">된 작업은 계속합니다.</tspan></text><rect x="106" y="1861" width="748" height="4" rx="2" fill="#e2e9f3"/><rect class="progress m24" x="106" y="1861" width="748" height="4" rx="2" fill="#0d9488"/><g class="completed m23"><circle cx="860" cy="1669" r="11" fill="#0d9488"/><path d="M854 1669l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
