<title id="title">동적 작업 구성: 의존할 때만 대기</title><desc id="description">하나의 Execution 단계 안에서 갈라지는 작업 예시 모든 글과 관계를 항상 표시합니다. 애니메이션은 입력 전달, 진행 상태, 결과 보존을 설명합니다. 동작을 꺼도 전체 흐름을 읽을 수 있습니다. 공유 쓰기가 충돌하면 순차 실행. 동시 실행 수는 실제 환경에 따릅니다.</desc>
