<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1618" viewBox="0 0 960 1618" role="img" aria-labelledby="title description" lang="zh-CN" xml:lang="zh-CN">
<title id="title">应用、数据和展示，各自负责</title><desc id="description">沿着一次任务，看配置、执行、记录和界面怎样连接 图中文字和关系完整保留。动效展示一轮输入传递、任务进度和产出保留；停止动画或减少动效时仍可读完整流程。 共享方法不在客户端重复维护；展示不另写一套业务规则。</desc>
