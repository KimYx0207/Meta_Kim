<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1327" viewBox="0 0 960 1327" role="img" aria-labelledby="title description" lang="ko-KR" xml:lang="ko-KR">
<title id="title">한 문장의 목표를 완성된 작업으로</title><desc id="description">예시: 작은 예약 앱 만들기 모든 글과 관계를 항상 표시합니다. 애니메이션은 입력 전달, 진행 상태, 결과 보존을 설명합니다. 동작을 꺼도 전체 흐름을 읽을 수 있습니다. 설계, 작업, 실제 결과가 하나의 목표를 따릅니다.</desc>
