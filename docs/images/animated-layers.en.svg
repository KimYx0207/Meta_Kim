<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1990" viewBox="0 0 960 1990" role="img" aria-labelledby="title description" lang="en" xml:lang="en">
<title id="title">Application, data and presentation</title><desc id="description">Follow one task through configuration, execution, records and UI All text and relationships stay visible. Motion demonstrates inputs, progress and retained outputs. The complete diagram remains readable with animation off or reduced motion. Shared methods stay in one source. Views do not duplicate business policy.</desc>
