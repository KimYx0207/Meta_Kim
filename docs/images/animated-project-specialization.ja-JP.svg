<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1289" viewBox="0 0 960 1289" role="img" aria-labelledby="title description" lang="ja-JP" xml:lang="ja-JP">
<title id="title">共通の基礎から、独立した専門能力へ</title><desc id="description">継続する各プロジェクトが、固有のルールと検証条件を持つ 文字と関係は常に表示します。アニメーションは入力の受け渡し、進捗、成果の保存を示します。動作を止めても全体を読めます。 次のタスクも各プロジェクトの能力を読み込む。上流の更新は記録した基準版との差分を確認する。</desc>
