<g class="node" data-label="호스트 어댑터" data-box="504,895,392,352"><rect x="504" y="895" width="392" height="352" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m13" x="504" y="895" width="392" height="352" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="530" y="953" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="530" dy="0">호스트 어댑터</tspan></text><text x="530" y="1009" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="530" dy="0">검증된 기능으로 실행</tspan><tspan x="530" dy="42">모델과 도구는 호스트</tspan><tspan x="530" dy="42">제공</tspan><tspan x="530" dy="42">실제 결과를 위 계층에</tspan><tspan x="530" dy="42">반환</tspan></text></g>
<g class="node" data-label="표현 계층" data-box="80,1341,800,226"><rect x="80" y="1341" width="800" height="226" rx="22" fill="#edf8f6" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m16" x="80" y="1341" width="800" height="226" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="480" y="1399" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">표현 계층</tspan></text><text x="480" y="1455" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">Live, 실행 화면, README 에 상태와 근거 표시</tspan><tspan x="480" dy="42">결과를 읽으며 선택 정책은 설정에서 관리</tspan></text></g>
