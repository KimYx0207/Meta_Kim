<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1741" viewBox="0 0 960 1741" role="img" aria-labelledby="title description" lang="ko-KR" xml:lang="ko-KR">
<title id="title">앱, 데이터, 화면의 책임을 나누기</title><desc id="description">한 작업을 따라 설정, 실행, 기록, 화면의 연결을 확인합니다 모든 글과 관계를 항상 표시합니다. 애니메이션은 입력 전달, 진행 상태, 결과 보존을 설명합니다. 동작을 꺼도 전체 흐름을 읽을 수 있습니다. 공통 방법은 한 원본에서 관리하고 화면에 업무 규칙을 중복하지 않습니다.</desc>
