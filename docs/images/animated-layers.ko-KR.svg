<text x="480" y="53" font-size="24" font-weight="700" fill="#2968e8" text-anchor="middle"><tspan x="480" dy="0">META KIM · 작동 방식</tspan></text>
<text x="480" y="113" font-size="40" font-weight="750" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">앱, 데이터, 화면의 책임을 나누기</tspan></text>
<text x="480" y="175" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">한 작업을 따라 설정, 실행, 기록, 화면의 연결을 확인합니다</tspan></text>
<path d="M56 231H904" stroke="#dce5f2" stroke-width="4"/><path class="clock" pathLength="1" d="M56 231H904" stroke="#2968e8" stroke-width="4"/>
