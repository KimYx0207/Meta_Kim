<g class="node" data-label="重要选择已就绪" data-box="72,856,376,226"><rect x="72" y="856" width="376" height="226" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m12" x="72" y="856" width="376" height="226" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="98" y="914" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="98" dy="0">重要选择已就绪</tspan></text><text x="98" y="970" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="98" dy="0">此时给出选项 · 让用</tspan><tspan x="98" dy="42">户做有效决定</tspan></text></g>
<path d="M480 478V497H924V820H700V856" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m15" pathLength="1" d="M480 478V497H924V820H700V856" fill="none" stroke="#ce7b24" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="风险或紧急变化" data-box="512,856,376,226"><rect x="512" y="856" width="376" height="226" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m16" x="512" y="856" width="376" height="226" rx="22" fill="#ce7b24" fill-opacity=".055" stroke="#ce7b24" stroke-width="3"/><text x="538" y="914" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="538" dy="0">风险或紧急变化</tspan></text><text x="538" y="970" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="538" dy="0">插入优先处理 · 调整</tspan><tspan x="538" dy="42">受影响的工作</tspan></text></g>
<text x="480" y="1156" font-size="30" font-weight="650" fill="#7c56d8" text-anchor="middle"><tspan x="480" dy="0">需要消化当前决定时，再安排留白</tspan></text>
<g class="node" data-label="留白 / Pause" data-box="80,1223,800,232"><rect x="80" y="1223" width="800" height="232" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m19" x="80" y="1223" width="800" height="232" rx="22" fill="#7c56d8" fill-opacity=".055" stroke="#7c56d8" stroke-width="3"/><text x="480" y="1281" font-size="25" font-weight="700" fill="#7c56d8" text-anchor="middle"><tspan x="480" dy="0">保留摘要、待办与恢复条件</tspan></text><text x="480" y="1329" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">留白 / Pause</tspan></text><text x="480" y="1385" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">信息过密时少推一步，保留消化空间</tspan></text></g>
<g class="node" data-label="条件明确后继续" data-box="80,1519,800,226"><rect x="80" y="1519" width="800" height="226" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m22" x="80" y="1519" width="800" height="226" rx="22" fill="#0d9488" fill-opacity=".055" stroke="#0d9488" stroke-width="3"/><text x="480" y="1577" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">条件明确后继续</tspan></text><text x="480" y="1633" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">记录暂停原因与恢复条件；独立且已授权的工作继</tspan><tspan x="480" dy="42">续。</tspan></text><rect x="106" y="1731" width="748" height="4" rx="2" fill="#e2e9f3"/><rect class="progress m24" x="106" y="1731" width="748" height="4" rx="2" fill="#0d9488"/><g class="completed m23"><circle cx="860" cy="1539" r="11" fill="#0d9488"/><path d="M854 1539l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<path d="M480 1455V1519" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m25" pathLength="1" d="M480 1455V1519" fill="none" stroke="#7c56d8" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M56 1780H904" stroke="#cad7e8"/>
