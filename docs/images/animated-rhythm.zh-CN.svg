<title id="title">节奏与留白：该出现时才出现</title><desc id="description">先判断当前信息是否值得占用用户注意力 · 四种判断按当前条件选用 图中文字和关系完整保留。动效展示一轮输入传递、任务进度和产出保留；停止动画或减少动效时仍可读完整流程。 Clarify、Options、Execute、Verify 等动作卡按条件调度。</desc>
