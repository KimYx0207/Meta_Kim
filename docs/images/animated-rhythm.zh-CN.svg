<text x="480" y="53" font-size="24" font-weight="700" fill="#2968e8" text-anchor="middle"><tspan x="480" dy="0">META KIM · 运行图解</tspan></text>
<text x="480" y="113" font-size="40" font-weight="750" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">节奏与留白：该出现时才出现</tspan></text>
<text x="480" y="175" font-size="30" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">先判断当前信息是否值得占用用户注意力 · 四种判断按当前</tspan><tspan x="480" dy="39">条件选用</tspan></text>
<path d="M56 270H904" stroke="#dce5f2" stroke-width="4"/><path class="clock" pathLength="1" d="M56 270H904" stroke="#2968e8" stroke-width="4"/>
<g class="node" data-label="当前任务出现新信息" data-box="80,294,800,184"><rect x="80" y="294" width="800" height="184" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m0" x="80" y="294" width="800" height="184" rx="22" fill="#2968e8" fill-opacity=".055" stroke="#2968e8" stroke-width="3"/><text x="480" y="352" font-size="36" font-weight="700" fill="#17263f" text-anchor="middle"><tspan x="480" dy="0">当前任务出现新信息</tspan></text><text x="480" y="408" font-size="32" font-weight="450" fill="#566782" text-anchor="middle"><tspan x="480" dy="0">检查条件、优先级、依赖和已确认内容</tspan></text></g>
<path d="M480 478V509H260V558" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m3" pathLength="1" d="M480 478V509H260V558" fill="none" stroke="#566782" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
<g class="node" data-label="已确认 / 无增益" data-box="72,558,376,226"><rect x="72" y="558" width="376" height="226" rx="22" fill="#fff" stroke="#cad7e8" stroke-width="1.5"/><rect class="focus m4" x="72" y="558" width="376" height="226" rx="22" fill="#566782" fill-opacity=".055" stroke="#566782" stroke-width="3"/><text x="98" y="616" font-size="36" font-weight="700" fill="#17263f" text-anchor="start"><tspan x="98" dy="0">已确认 / 无增益</tspan></text><text x="98" y="672" font-size="32" font-weight="450" fill="#566782" text-anchor="start"><tspan x="98" dy="0">略过或不推送 · 避免</tspan><tspan x="98" dy="42">重复问题</tspan></text></g>
<path d="M480 478V509H700V558" fill="none" stroke="#cad7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="transfer m7" pathLength="1" d="M480 478V509H700V558" fill="none" stroke="#0d9488" stroke-width="4.5" stroke-dasharray="1" stroke-linecap="round" stroke-linejoin="round"/>
