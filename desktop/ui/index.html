<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta_Kim</title><style>:root{color-scheme:dark;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07090e;color:#eef2f8;overflow:hidden;user-select:none}main{height:100%;display:grid;place-content:center;justify-items:center;gap:16px;padding:32px;text-align:center;background:radial-gradient(ellipse 60% 45% at 50% 35%,rgba(215,189,136,.12),transparent 70%)}.mark{width:54px;height:54px;border-radius:12px;border:1px solid #484234;background:linear-gradient(155deg,#1d1b16,#101218);display:grid;place-items:center;font-size:24px;font-weight:700;color:#ebd097;box-shadow:0 12px 34px rgba(0,0,0,.45);position:relative}.mark::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:1px solid rgba(235,208,151,.25);animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.95;transform:scale(1.03)}}h1{margin:4px 0 0;font-size:20px;font-weight:600}p{margin:0;max-width:420px;font-size:13px;line-height:1.6;color:#9ba4b4}.err{display:none;margin-top:8px;padding:12px 16px;border-radius:8px;border:1px solid #7c4a46;background:#241718;color:#f3c4be;font-size:12px;max-width:520px;user-select:text}</style></head><body><main><div class="mark">K</div><h1>Meta_Kim</h1><p id="msg">正在启动本机受控治理内核与 24 小时值班引擎…</p><div id="err" class="err"></div></main><script>window.__showBootError=function(t){var e=document.getElementById("err"),m=document.getElementById("msg");if(m)m.textContent="启动受阻，请检查本机运行环境";if(e){e.style.display="block";e.textContent=String(t||"")}};document.addEventListener("contextmenu",function(e){e.preventDefault()});</script></body></html>
