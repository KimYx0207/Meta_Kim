[package]
name = "meta-kim-desktop"
version = "1.0.0"
description = "Meta_Kim desktop shell; runs beside a full Meta_Kim source checkout"
authors = ["Meta_Kim Contributors"]
license = "MIT"
edition = "2021"
# Cargo.lock pins Tauri 2.7 (tauri, tauri-build, its plugins) and muda 0.20,
# which declare rust-version 1.90, so 1.90 is the lowest toolchain that can
# build the locked tree. CI checks the desktop crate with exactly this
# declared toolchain.
rust-version = "1.90"
default-run = "meta-kim-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
