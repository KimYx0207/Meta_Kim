[package]
name = "meta-kim-desktop"
version = "1.0.0"
description = "Meta_Kim Standalone Native Desktop Client"
authors = ["Meta_Kim Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "meta-kim-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
