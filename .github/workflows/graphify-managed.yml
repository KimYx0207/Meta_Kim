name: Managed Graphify safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-lifecycle:
    name: Managed lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read the shared dependency baseline
        id: dependency-baseline
        run: node scripts/dependency-baseline.mjs --github-output
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.dependency-baseline.outputs.node-regression }}
      - name: Install the pinned native producer test dependency from PyPI
        run: |
          python -c "import json,subprocess,sys; d=json.load(open('config/dependency-baseline.json'))['graphify']; subprocess.check_call([sys.executable,'-m','pip','install','--only-binary=:all:',d['package']+'=='+d['version']])"
      - name: Require the tested producer version
        run: python -c "import json; from importlib.metadata import version; d=json.load(open('config/dependency-baseline.json'))['graphify']; assert version(d['package']) == d['version']"
      # All repositories, hooks, outputs, and sentinel files are isolated test
      # fixtures. Native extraction/clustering does not invoke models.
      - name: Test path containment, shared hook ownership, and replacement races
        run: python tests/setup/graphify-managed-safety.test.py
      - name: Test the native manager lifecycle
        run: python tests/setup/graphify-managed.test.py
      - name: Test native producer identity and relationship preservation
        run: python tests/setup/graphify-managed-producer.test.py
      - name: Test Graphify CLI, setup routing, and existing regressions
        run: node --test tests/setup/graphify*.test.mjs
