name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-regression:
    name: Behavior regression (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [core, governance, live]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The migration fingerprint check reads historical agent blobs.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Install test dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      # Every PR/push runs these lanes, including Markdown-only changes to
      # canonical prompts. Each matrix job has its own workspace. The runner
      # uses a fresh home and an environment allow-list without credentials.
      # Live here means local UI/service tests, not paid model conversations.
      - name: Run isolated behavioral checks
        run: npm run meta:test:ci -- --suite ${{ matrix.lane }}

  setup-platform:
    name: Setup and process regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Fingerprints bind exact canonical source bytes, not host CRLF rewrites.
      - name: Preserve canonical checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      # Real host filesystem/process tests complement cross-host lexical
      # fixtures. HOME and credentials use the same isolated runner as above.
      # Invoke Node directly so PowerShell's npm.ps1 cannot consume --suite.
      - name: Diagnose Windows cmdlet isolation boundaries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { spawn } from 'node:child_process';
          import { mkdtempSync, mkdirSync, writeFileSync, rmSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { buildIsolatedTestEnvironment } from './scripts/run-local-verification.mjs';
          const profile = ['HOME', 'USERPROFILE', 'HOMEDRIVE', 'HOMEPATH', 'USERNAME', 'USERDOMAIN', 'LOGONSERVER', 'SESSIONNAME', 'COMPUTERNAME'];
          const appdata = ['APPDATA', 'LOCALAPPDATA', 'PSModuleAnalysisCachePath'];
          const temp = ['TMPDIR', 'TMP', 'TEMP'];
          function overlay(target, source, keys) {
            for (const name of keys) {
              for (const key of Object.keys(target)) if (key.toUpperCase() === name.toUpperCase()) delete target[key];
              const entry = Object.entries(source).find(([key]) => key.toUpperCase() === name.toUpperCase());
              if (entry) target[entry[0]] = entry[1];
            }
            return target;
          }
          async function probe(label, makeEnv, qualified = false) {
            const home = mkdtempSync(path.join(os.tmpdir(), 'meta-kim-shell-diagnostic-'));
            const isolated = buildIsolatedTestEnvironment(home);
            for (const name of ['tmp', 'appdata', 'localappdata', 'config', 'cache', 'data', 'state', 'npm-cache']) mkdirSync(path.join(home, name), { recursive: true });
            const script = path.join(home, 'ready.ps1');
            const utility = qualified ? 'Microsoft.PowerShell.Utility\\' : '';
            const management = qualified ? 'Microsoft.PowerShell.Management\\' : '';
            writeFileSync(script, [
              "[Console]::Out.WriteLine('STAGE_start')",
              `$null = ${utility}New-Object System.Text.UTF8Encoding($false)`,
              "[Console]::Out.WriteLine('STAGE_new_object')",
              `$null = ${management}Test-Path -LiteralPath $PSHOME`,
              "[Console]::Out.WriteLine('STAGE_test_path')",
              `$null = @{ ready = $true } | ${utility}ConvertTo-Json -Compress`,
              "[Console]::Out.WriteLine('STAGE_json')",
              `${utility}Write-Output 'PS_DONE'`,
              'exit 0',
            ].join('\n'));
            const start = Date.now();
            const child = spawn('powershell.exe', ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', script], { env: makeEnv(isolated, home), stdio: ['pipe', 'pipe', 'pipe'], windowsHide: true });
            let output = '', stderrBytes = 0, timedOut = false;
            child.stdout.on('data', data => { output = (output + data).slice(-1024); });
            child.stderr.on('data', data => { stderrBytes += data.length; });
            const timer = setTimeout(() => { timedOut = true; child.kill('SIGKILL'); }, 8000);
            const result = await new Promise(resolve => { child.once('error', error => resolve({ error: error.code })); child.once('close', (code, signal) => resolve({ code, signal })); });
            clearTimeout(timer);
            const stages = output.match(/STAGE_[a-z_]+|PS_DONE/g) || [];
            console.log(JSON.stringify({ label, stages, stderrBytes, timedOut, elapsedMs: Date.now() - start, ...result }));
            rmSync(home, { recursive: true, force: true });
            return stages.includes('PS_DONE') && result.code === 0;
          }
          const builtinModules = path.join(process.env.SystemRoot || process.env.SYSTEMROOT, 'System32', 'WindowsPowerShell', 'v1.0', 'Modules');
          await probe('baseline', () => process.env);
          const ready = await probe('isolated', isolated => isolated);
          await probe('isolated-builtin-modules', isolated => ({ ...isolated, PSModulePath: builtinModules }));
          await probe('isolated-profile-restored', isolated => overlay(isolated, process.env, profile));
          await probe('isolated-appdata-restored', isolated => overlay(isolated, process.env, appdata));
          await probe('isolated-localappdata-restored', isolated => overlay(isolated, process.env, ['LOCALAPPDATA']));
          await probe('isolated-appdata-only-restored', isolated => overlay(isolated, process.env, ['APPDATA']));
          await probe('isolated-temp-restored', isolated => overlay(isolated, process.env, temp));
          await probe('baseline-profile-isolated', isolated => overlay({ ...process.env }, isolated, profile));
          await probe('baseline-appdata-isolated', isolated => overlay({ ...process.env }, isolated, appdata));
          await probe('baseline-temp-isolated', isolated => overlay({ ...process.env }, isolated, temp));
          await probe('isolated-qualified-cmdlets', isolated => isolated, true);
          await probe('isolated-builtin-explicit-cache', (isolated, home) => ({ ...isolated, PSModulePath: builtinModules, PSModuleAnalysisCachePath: path.join(home, 'cache', 'ModuleAnalysisCache') }));
          if (!ready) process.exitCode = 1;
          NODE
      - name: Run isolated setup and process checks
        run: node scripts/run-local-verification.mjs --isolated --suite setup-platform

  planning-continuity:
    name: Planning continuity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Test planning recovery and linked project boundaries
        run: |
          node scripts/validate-planning-continuity.mjs
          node --test tests/governance/planning-continuity.test.mjs tests/governance/planning-continuity-project-root.test.mjs

  global-sync-policy:
    name: Global sync policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Check global sync syntax
        run: node --check scripts/sync-global-meta-theory.mjs
      - name: Test global sync and stale-alias policy
        run: node --test tests/setup/stale-skill-alias-policy.test.mjs

  installer-regression:
    name: Installer ownership regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      # These tests use isolated homes and local synthetic skills. They do not
      # install third-party plugins, contact providers, or modify runner homes.
      - name: Test retirement, independent updates, and ownership boundaries
        run: node --test tests/setup/retire-planning-with-files.test.mjs tests/setup/meta-skill-creator-installer.test.mjs tests/setup/install-status-semantics.test.mjs tests/setup/installer-runtime-boundary.test.mjs

  package-candidate:
    name: Package candidate
    if: github.event_name != 'pull_request'
    needs: [behavior-regression, setup-platform, planning-continuity, global-sync-policy, installer-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Build npm package candidate
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Upload package candidate
        uses: actions/upload-artifact@v7
        with:
          name: meta-kim-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
