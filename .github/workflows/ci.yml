name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-regression:
    name: Behavior regression (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [core, governance, live]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The migration fingerprint check reads historical agent blobs.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Install test dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      # Every PR/push runs these lanes, including Markdown-only changes to
      # canonical prompts. Each matrix job has its own workspace. The runner
      # uses a fresh home and an environment allow-list without credentials.
      # Live here means local UI/service tests, not paid model conversations.
      - name: Run isolated behavioral checks
        run: npm run meta:test:ci -- --suite ${{ matrix.lane }}

  setup-platform:
    name: Setup and process regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Fingerprints bind exact canonical source bytes, not host CRLF rewrites.
      - name: Preserve canonical checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      # Real host filesystem/process tests complement cross-host lexical
      # fixtures. HOME and credentials use the same isolated runner as above.
      # Invoke Node directly so PowerShell's npm.ps1 cannot consume --suite.
      - name: Run isolated setup and process checks
        run: node scripts/run-local-verification.mjs --isolated --suite setup-platform

  planning-continuity:
    name: Planning continuity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Test planning recovery and linked project boundaries
        run: |
          node scripts/validate-planning-continuity.mjs
          node --test tests/governance/planning-continuity.test.mjs tests/governance/planning-continuity-project-root.test.mjs

  global-sync-policy:
    name: Global sync policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Check global sync syntax
        run: node --check scripts/sync-global-meta-theory.mjs
      - name: Test global sync and stale-alias policy
        run: node --test tests/setup/stale-skill-alias-policy.test.mjs

  installer-regression:
    name: Installer ownership regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      # These tests use isolated homes and local synthetic skills. They do not
      # install third-party plugins, contact providers, or modify runner homes.
      - name: Test retirement, independent updates, and ownership boundaries
        run: node --test tests/setup/retire-planning-with-files.test.mjs tests/setup/meta-skill-creator-installer.test.mjs tests/setup/install-status-semantics.test.mjs tests/setup/installer-runtime-boundary.test.mjs

  dependency-calculation:
    name: Real dependency calculation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          path: Meta_Kim
          persist-credentials: false
      - name: Check out the reviewed first-party calculator source
        uses: actions/checkout@v7
        with:
          repository: KimYx0207/Kim_Service
          ref: 67d19a5d612e7038a9e8ad33a4e80e30f7159ddc
          path: Kim_Service
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing MCP dependencies without lifecycle scripts
        working-directory: Meta_Kim
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      # Fixed synthetic requests and real stdlib Python/MCP. No models, provider
      # credentials, supplier contact or purchasing are involved.
      - name: Test original request, existing route, real tool and delivery
        working-directory: Meta_Kim
        env:
          META_KIM_TEST_KIM_SERVICE_SOURCE: ${{ github.workspace }}/Kim_Service
        run: node --test tests/governance/dependency-calculation.test.mjs tests/governance/dependency-calculation-handoff.test.mjs tests/governance/store-calculation-integration.test.mjs tests/governance/dependency-delivery-envelope.test.mjs

  package-candidate:
    name: Package candidate
    if: github.event_name != 'pull_request'
    needs: [behavior-regression, setup-platform, planning-continuity, global-sync-policy, installer-regression, dependency-calculation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Build npm package candidate
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Upload package candidate
        uses: actions/upload-artifact@v7
        with:
          name: meta-kim-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
