name: README visuals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-screenshots:
    name: Real Live UI in four languages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser and CJK fonts
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium-headless-shell
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual Live controls and task details
        run: python scripts/capture-live-readme-screenshots.py --output browser-artifacts/readme
      - name: Verify the unified workspace through real Hub HTTP and host CLI
        run: python scripts/verify-live-workspace-browser.py --output browser-artifacts/workspace
      # Preserve concise success receipts; the full browser evidence remains available on failures.
      - name: Prepare compact successful-run evidence
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('browser-artifacts')
          target = Path('compact-browser-evidence')
          for folder, preferred in (
              ('readme', ('meta-kim-live-task.png', 'meta-kim-live-detail.png')),
              ('workspace', ('live-workspace-desktop.png', 'live-workspace-mobile.png')),
          ):
              source = root / folder
              destination = target / folder
              destination.mkdir(parents=True, exist_ok=True)
              for name in preferred:
                  file = source / name
                  if file.is_file():
                      shutil.copy2(file, destination / name)
              for file in source.glob('*.json'):
                  shutil.copy2(file, destination / file.name)
          PY
      - name: Save compact successful-run screenshots and receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-browser-success-evidence
          path: compact-browser-evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Preserve full README browser evidence on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-readme-screenshots
          path: browser-artifacts/readme/
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve full workspace integration evidence on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-workspace-browser
          path: browser-artifacts/workspace/
          if-no-files-found: warn
          retention-days: 3
